name: Build Mi TV Voice Remote APK
on:
push:
branches: [ main, master ]
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Unpack Project
run: printf '%s' '' | base64 -d | tar -xz
- name: Set up JDK 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'
- name: Setup Gradle 8.7
uses: gradle/actions/setup-gradle@v4
with:
gradle-version: '8.7'
- name: Build Debug APK
working-directory: MiTvVoiceRemote
run: gradle assembleDebug --stacktrace
- name: Upload APK Artifact
uses: actions/upload-artifact@v4
with:
name: MiTV-Voice-Remote-APK
path: MiTvVoiceRemote/app/build/outputs/apk/debug/app-debug.apk
retention-days: 30
